[package]
name = "stegocrypt"
version = "2.0.0"
description = "StegoCrypt Steganography Engine"
authors = ["Türkay Yıldırım"]
edition = "2021"

[lib]
name = "stegocrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stegocrypt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
